<!-- templates/jaguar_detected.html -->
{% extends "base.html" %}

{% block content %}
<div class="container">
    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Bioscanner Logo" class="logo">
    
    <div class="result-box detected">
        <div class="result-image">
            <img src="{{ result }}" alt="Detected Jaguar" class="detection-image">
        </div>
        <div class="result-message">
            <img src="{{ url_for('static', filename='images/check-icon.png') }}" alt="Check" class="result-icon">
            <p>A jaguar has been detected</p>
        </div>
        <a href="{{ url_for('upload') }}" class="btn-restart">↶ Restart</a>
    </div>
</div>

<div class="forest-bg"></div>

<footer class="footer">
    © 2025 C Minds. Todos los derechos reservados.
</footer>
{% endblock %}
