<!-- templates/upload.html -->
{% extends "base.html" %}

{% block content %}
<div class="container">
    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Bioscanner Logo" class="logo">
    <h1 class="upload-title">Upload a photo</h1>
    <p class="upload-subtitle">Please, select drag or drop a .jpg or .png file</p>
    
    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data" id="upload-form">
        <div class="upload-box" id="upload-box">
            <div class="upload-content">
                <img src="{{ url_for('static', filename='images/upload-icon.svg') }}" alt="Upload" class="upload-icon">
                <p>Drag and Drop here</p>
                <p>or</p>
                <label for="file-input" class="btn-upload">Select file</label>
                <input type="file" id="file-input" name="file" accept=".jpg,.jpeg,.png" hidden>
            </div>
        </div>
    </form>
</div>

<div class="forest-bg"></div>

<footer class="footer">
    © 2025 C Minds. Todos los derechos reservados.
</footer>

<script>
    const uploadBox = document.getElementById('upload-box');
    const fileInput = document.getElementById('file-input');
    const uploadForm = document.getElementById('upload-form');

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadBox.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    // Highlight drop zone when item is dragged over it
    ['dragenter', 'dragover'].forEach(eventName => {
        uploadBox.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        uploadBox.addEventListener(eventName, unhighlight, false);
    });

    // Handle dropped files
    uploadBox.addEventListener('drop', handleDrop, false);
    fileInput.addEventListener('change', handleFiles, false);

    function preventDefaults (e) {
        e.preventDefault();
        e.stopPropagation();
    }

    function highlight(e) {
        uploadBox.classList.add('highlight');
    }

    function unhighlight(e) {
        uploadBox.classList.remove('highlight');
    }

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        
        if (files.length > 0) {
            fileInput.files = files;
            uploadForm.submit();
        }
    }

    function handleFiles(e) {
        if (fileInput.files.length > 0) {
            uploadForm.submit();
        }
    }
</script>
{% endblock %}
